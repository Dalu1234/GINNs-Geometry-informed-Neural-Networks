###################
## PROPER A/B TEST: Original GINN + Connectivity
## 
## This config matches the original GINN-model.pt settings EXACTLY
## with ONE change: adding connectivity loss
##
## Compare results against original (0% connectivity, avg 11.8 components)
###################

wandb_experiment_name: 'simjeb_connectivity_AB_test'

# ============================================
# MATCH ORIGINAL EXACTLY
# ============================================
vars:
  nx: 3
  nz: 2                   # SAME as original (was 8 in bad test)
  ginn_bsize: 9           # SAME as original
  problem_str: 'simjeb'
  ginn_on: 1
  level_set: 0

nx: ${vars.nx}
nz: ${vars.nz}
ginn_bsize: ${vars.ginn_bsize}
level_set: ${vars.level_set}

nf_is_density: False

###################
## Training Mode - SUPERVISED (same as original)
###################
training_mode: 'single'   # supervised mode with specific shapes

###################
## Model - SAME as original
###################
model:
  model_str: 'cond_wire'
  nx: ${vars.nx}
  nz: ${vars.nz}
  return_density: False
  w0_initial: 18
  w0: 1                    # ADDED: was missing
  wire_scale: 6
  layers: [128, 128, 128]
  use_legacy_gabor: True   # REQUIRED for loading pretrained GINN-model.pt

reset_zlatents_every_n_epochs: 1    # ADDED: same as original

latent_sampling:
  nz: ${vars.nz}
  ginn_bsize: ${vars.ginn_bsize}
  z_sample_method: 'uniform'          # SAME as original (was equidistant)
  val_plot_grid: [3, 3]
  z_sample_interval: [0, 0.1]          # SAME as original (was [-1, 1])!

###################
## Data - SAME shapes as original
###################
data:
  simjeb_ids: [62, 148]   # SAME as original

###################
## Plotting
###################
train_plot_max_n_shapes: 9
plot_every_n_epochs: 200
valid_every_n_epochs: 2000

###################
## Loss Configuration - SAME as original
###################
objective: 'curv'
field_losses: []

lambda_data: 0.0
lambda_lip: 0.0
lambda_dirichlet: 0.0

# GINN LOSSES - SAME weights as original
lambda_if: 100            # SAME
lambda_env: 1000          # SAME
lambda_obst: 0.0          # SAME
lambda_if_normal: 1.0     # SAME
lambda_eikonal: 0.01      # SAME
lambda_scc: 1             # SAME
lambda_curv: 0.001        # SAME
lambda_div: 1             # SAME
lambda_comp: 0.0          # compliance (disabled)
lambda_vol: 0.0           # volume (disabled)

max_curv: 0
max_div: -0.1

start_curv: 0
start_div: 0

scale_curv: 1.0
scale_div: 1.0
scale_eikonal: 1.0

dirichlet_use_surface_points: True

###################
## THE ONE CHANGE: ADD CONNECTIVITY LOSS
###################
lambda_connectivity: 1.0           # ENABLED for fine-tuning
connectivity_n_samples: 500
connectivity_n_iter: 30
connectivity_grad_tol: 0.01
connectivity_update_every_n_epochs: 50
connectivity_near_surface_threshold: 0.15
connectivity_max_step_size: 0.3
scale_connectivity: 1.0
start_connectivity: 0              # Start immediately (shapes already formed from pretrained)

###################
## Curvature
###################
exclude_surface_points_close_to_interface_cutoff: 0.02

###################
## SCC Algorithm (topology) - SAME as original
###################
ph:
  nx: ${vars.nx}
  problem_str: ${vars.problem_str}
  ginn_bsize: ${vars.ginn_bsize}
  is_density: False
  iso_level: -0.02
  ph_1_hole_level: 0.06
  ph_loss_maxdim: 1
  ph_loss_target_betti: [1, 0, 0]
  scc_penalty_norm_eps: 1.0e-4
  scc_n_grid_points: 32            # Reduced from 64 (memory issue)
  evaluate_ph_grid_per_shape: True

###################
## Surface Points
###################
surface:
  nx: ${vars.nx}
  n_points_surface: 8192
  level_set: ${vars.level_set}
  do_numerical_surface_points: True
  bin_search_steps: 10
  equidistant_init_grid: True
  do_uniform_resampling: True
  recompute_every_n_epochs: 1

###################
## Logging
###################
log_level: 'WARNING'
num_workers: 8

###################
## Plotting
###################
plot:
  val_plot_grid: [3, 3]
  problem_str: ${vars.problem_str}
  fig_size: [12, 7]
  level_set: ${vars.level_set}
  show_colorbar: True

meshing:
  level_set: ${vars.level_set}
  nf_is_density: False
  mc_resolution: 128

plot_shape: True
val_plot_shape: True
plot_surface_points: True
plot_ph_diagram: True

timer:
  print: False
  accumulate: True

###################
## Problem
###################
problem:
  problem_str: ${vars.problem_str}

problem_sampling:
  nx: ${vars.nx}
  n_points_domain: 2048
  n_points_envelope: 16383
  n_points_interfaces: 4096
  n_points_normals: 4096
  n_points_surface: 8192

###################
## Training - FINE-TUNE pretrained model
###################
max_epochs: 1000           # Fine-tune for 1000 epochs with connectivity
lr: 0.001
opt: adam
use_scheduler: False
scheduler_gamma: 0.5
decay_steps: 5000

# Augmented Lagrangian - SAME as original
use_augmented_lagrangian: True

grad_clipping:
  grad_clipping_on: True
  grad_clip: 0.5
  auto_clip_on: True

model_save_path: 'checkpoints'
save_every_n_epochs: 1000
overwrite_existing_saved_model: True
save_optimizer: True

load_mos: False
load_model: True                    # LOAD pretrained GINN!
model_load_path: 'checkpoints/GINN-model.pt'
load_optimizer: False
load_scheduler: False
