###################
## CONNECTIVITY FINE-TUNING V2: Proper Fine-tuning Strategy
## 
## Key changes from failed A/B test:
## 1. REDUCE competing losses (interface, SCC, div)
## 2. LOWER learning rate (0.0001 vs 0.001)
## 3. HIGHER connectivity weight (50× vs 1×)
## 4. FEWER epochs (200 vs 1000) to avoid catastrophic forgetting
##
## Goal: Gently nudge pretrained model toward connectivity
##       without destroying learned shape representations
###################

wandb_experiment_name: 'simjeb_connectivity_finetune_v2'

# ============================================
# MATCH ORIGINAL ARCHITECTURE
# ============================================
vars:
  nx: 3
  nz: 2
  ginn_bsize: 9
  problem_str: 'simjeb'
  ginn_on: 1
  level_set: 0

nx: ${vars.nx}
nz: ${vars.nz}
ginn_bsize: ${vars.ginn_bsize}
level_set: ${vars.level_set}

nf_is_density: False

###################
## Training Mode
###################
training_mode: 'single'

###################
## Model - SAME as original
###################
model:
  model_str: 'cond_wire'
  nx: ${vars.nx}
  nz: ${vars.nz}
  return_density: False
  w0_initial: 18
  w0: 1
  wire_scale: 6
  layers: [128, 128, 128]
  use_legacy_gabor: True

reset_zlatents_every_n_epochs: 1

latent_sampling:
  nz: ${vars.nz}
  ginn_bsize: ${vars.ginn_bsize}
  z_sample_method: 'uniform'
  val_plot_grid: [3, 3]
  z_sample_interval: [0, 0.1]

###################
## Data
###################
data:
  simjeb_ids: [62, 148]

###################
## Plotting
###################
train_plot_max_n_shapes: 9
plot_every_n_epochs: 50
valid_every_n_epochs: 100

###################
## LOSS CONFIGURATION - KEY CHANGES FOR FINE-TUNING
###################
objective: 'curv'
field_losses: []

lambda_data: 0.0
lambda_lip: 0.0
lambda_dirichlet: 0.0

# ============================================
# REDUCED COMPETING LOSSES (was fighting connectivity)
# ============================================
lambda_if: 10            # REDUCED from 100 → 10 (10×)
lambda_env: 100          # REDUCED from 1000 → 100 (10×)
lambda_obst: 0.0
lambda_if_normal: 0.1    # REDUCED from 1.0 → 0.1

# These were main competitors - DISABLE for pure connectivity fine-tuning
lambda_scc: 0.0          # DISABLED (was 1) - conflicts with connectivity
lambda_div: 0.0          # DISABLED (was 1) - can fragment shapes

# Keep some regularization
lambda_eikonal: 0.01     # SAME - maintains SDF property
lambda_curv: 0.0001      # REDUCED from 0.001 - allows bridges to form

lambda_comp: 0.0
lambda_vol: 0.0

max_curv: 0
max_div: -0.1

start_curv: 0
start_div: 0

scale_curv: 1.0
scale_div: 1.0
scale_eikonal: 1.0

dirichlet_use_surface_points: True

# ============================================
# CONNECTIVITY LOSS - MUCH STRONGER WEIGHT
# ============================================
lambda_connectivity: 50.0          # INCREASED from 1.0 → 50.0 (50×)
connectivity_n_samples: 500
connectivity_n_iter: 30
connectivity_grad_tol: 0.01
connectivity_update_every_n_epochs: 20  # More frequent updates
connectivity_near_surface_threshold: 0.15
connectivity_max_step_size: 0.3
scale_connectivity: 1.0
start_connectivity: 0

###################
## Curvature
###################
curvature_expression: '4*H**2 - 2*K'
curvature_use_gradnorm_weights: False
curvature_pts_source: 'surface'

###################
## Surface Points
###################
exclude_surface_points_close_to_interface_cutoff: 0.02

###################
## SCC/PH - DISABLED (conflicts with connectivity)
###################
ph:
  nx: ${vars.nx}
  problem_str: ${vars.problem_str}
  ginn_bsize: ${vars.ginn_bsize}
  is_density: False
  iso_level: -0.02
  ph_1_hole_level: 0.06
  ph_loss_maxdim: 1
  ph_loss_target_betti: [1, 0, 0]
  scc_penalty_norm_eps: 1.0e-4
  scc_n_grid_points: 32
  evaluate_ph_grid_per_shape: True

###################
## Surface Points
###################
surface:
  nx: ${vars.nx}
  n_points_surface: 8192
  level_set: ${vars.level_set}
  do_numerical_surface_points: True
  bin_search_steps: 10
  equidistant_init_grid: True
  do_uniform_resampling: True
  recompute_every_n_epochs: 1

###################
## Logging
###################
log_level: 'WARNING'
num_workers: 8

###################
## Plotting
###################
plot:
  val_plot_grid: [3, 3]
  problem_str: ${vars.problem_str}
  fig_size: [12, 7]
  level_set: ${vars.level_set}
  show_colorbar: True

meshing:
  level_set: ${vars.level_set}
  nf_is_density: False
  mc_resolution: 128

plot_shape: True
val_plot_shape: True
plot_surface_points: True
plot_ph_diagram: False  # Disabled since SCC is off

timer:
  print: False
  accumulate: True

###################
## Problem
###################
problem:
  problem_str: ${vars.problem_str}

problem_sampling:
  nx: ${vars.nx}
  n_points_domain: 2048
  n_points_envelope: 16383
  n_points_interfaces: 4096
  n_points_normals: 4096
  n_points_surface: 8192

###################
## TRAINING - FINE-TUNING SETTINGS
###################
max_epochs: 200            # REDUCED from 1000 → 200 (avoid catastrophic forgetting)
lr: 0.0001                 # REDUCED from 0.001 → 0.0001 (10×)
opt: adam
use_scheduler: False
scheduler_gamma: 0.5
decay_steps: 5000

# Augmented Lagrangian - keep for envelope constraint
use_augmented_lagrangian: True

grad_clipping:
  grad_clipping_on: True
  grad_clip: 0.5
  auto_clip_on: True

model_save_path: 'checkpoints'
save_every_n_epochs: 50    # Save more frequently for monitoring
overwrite_existing_saved_model: True
save_optimizer: True

# LOAD PRETRAINED MODEL
load_mos: False
load_model: True
model_load_path: 'checkpoints/GINN-model.pt'
load_optimizer: False
load_scheduler: False
