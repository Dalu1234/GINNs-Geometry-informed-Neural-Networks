###################
## Regular GINN on LEGO 1xN (no tiled coords, no dist_to_edge)
## Use this config to compare "LEGO model" vs "regular GINN" on the same problem.
## Same losses, same data, same conditioning — only model inputs differ.
###################
wandb_experiment_name: 'lego_1xN_cond_wire_regular'

# Reuse same vars as LEGO config
vars:
  nx: 3
  nz: 2
  ginn_bsize: 4
  val_plot_grid: [3, 3]
  problem_str: 'lego_1xN'
  ginn_on: 1
  condition_on_n_studs: true
  n_studs_values: [2,4,5,8,12]
  condition_on_n_studs_y: true
  n_studs_y_values: [1]
  condition_on_height: true
  height_values: [1.0]
  n_points_surface: 20000
  nf_is_density: false
  level_set: 0.0

nx: ${vars.nx}
nz: ${vars.nz}
ginn_bsize: ${vars.ginn_bsize}
level_set: ${vars.level_set}
nf_is_density: ${vars.nf_is_density}
condition_on_n_studs: ${vars.condition_on_n_studs}
n_studs_values: ${vars.n_studs_values}
condition_on_n_studs_y: ${vars.condition_on_n_studs_y}
n_studs_y_values: ${vars.n_studs_y_values}
condition_on_height: ${vars.condition_on_height}
height_values: ${vars.height_values}

model:
  model_str: 'cond_wire'
  nx: ${vars.nx}
  nz: ${vars.nz}
  return_density: ${vars.nf_is_density}
  w0_initial: 18
  wire_scale: 6
  # Same capacity as LEGO model for fair comparison (or use [128,128,128] for "small regular")
  layers: [256,256,256,256]
  # --- Regular GINN: no LEGO-specific inputs ---
  use_tiled_coords: false
  use_dist_to_edge: false
  stud_spacing_normalized: 1.0
  n_studs_values: ${n_studs_values}
  use_hypernet: false
  lora_rank: 16
  c_dim: 3
  hypernet_hidden: [64, 64, 32]
  lora_init_scale: 0.01

reset_zlatents_every_n_epochs: 1
latent_sampling:
  nz: ${vars.nz}
  ginn_bsize: ${vars.ginn_bsize}
  z_sample_method: 'uniform'
  val_plot_grid: ${vars.val_plot_grid}
  z_sample_interval: [0,0.1]

violation_buffer:
  use: true
  initial_size_per_c: 50
  sample_temperature: 1.0
  random_fraction: 0.1
  block_epochs_per_type: 0
  eps: 1.0e-8

###################
## GINN (same as LEGO)
###################
train_plot_max_n_shapes: 9
plot_every_n_epochs: 100
valid_every_n_epochs: 200
skip_plot_epoch_0: true

###################
## Loss-balancing (same as LEGO)
###################
objective: 'null'
lambda_data: 0.0e+1
lambda_lip: ${eval:1.0e-7 * 0}
lambda_dirichlet: ${eval:1.0e1 * 0}
lambda_if: 0
lambda_env: 0
lambda_obst: ${eval:${vars.ginn_on} * 0.0}
lambda_if_normal: 0
lambda_cuboid_rule: 0
lambda_cuboid_primitive: ${eval:${vars.ginn_on} * 10}
lambda_stud_grid: ${eval:${vars.ginn_on} * 10}
lambda_prior: ${eval:${vars.ginn_on} * 0}
lambda_latent_structure: ${eval:${vars.ginn_on} * 0}
sample_z_from_prior_prob: 0.0
prior_hidden: [32, 32]
prior_min_sigma: 1.0e-3

cuboid_n_inside: 800
cuboid_n_near_faces: 400
cuboid_n_corners: 200
cuboid_n_far: 200
cuboid_n_boundary: 400
cuboid_safety_margin: 0.1
cuboid_boundary_weight: 0.5

stud_grid_n_samples: 200
stud_grid_n_outside: 40
stud_grid_shell_thickness: 0.02
stud_grid_safety_margin: 0.05
stud_spacing_normalized: 1.0

latent_min_variance: 0.1
latent_max_magnitude: 3.0
latent_diversity_weight: 1.0
latent_n_diversity_pts: 100

lambda_eikonal: ${eval:${vars.ginn_on} * 1.0}
lambda_scc: ${eval:${vars.ginn_on} * 0}
lambda_curv: 0
lambda_div: 0
max_curv: 0
max_div: -0.1

start_curv: 500
start_div: 2000
scale_curv: 5.0e-4
scale_div: 0.03
scale_chamfer_div: 1
scale_vol: 1
scale_comp: 1
scale_eikonal: 0.01
scale_if_normal: 1
dirichlet_use_surface_points: true

exclude_surface_points_close_to_interface_cutoff: 0.04

ph:
  nx: ${vars.nx}
  problem_str: ${vars.problem_str}
  ginn_bsize: ${vars.ginn_bsize}
  is_density: ${vars.nf_is_density}
  iso_level: -0.02
  ph_1_hole_level: 0.06
  ph_loss_maxdim: 1
  ph_loss_target_betti: [1, 0, 0]
  scc_penalty_norm_eps: 1.0e-4
  scc_n_grid_points: 32
  ph_max_num_workers: 4
  evaluate_ph_grid_per_shape: true

surface:
  nx: ${vars.nx}
  n_points_surface: ${vars.n_points_surface}
  level_set: ${vars.level_set}
  do_numerical_surface_points: false
  bin_search_steps: 10
  equidistant_init_grid: true
  do_uniform_resampling: true
  recompute_every_n_epochs: 1

div_norm_order: 2

log_level: 'INFO'
num_workers: 9

plot:
  val_plot_grid: ${vars.val_plot_grid}
  problem_str: ${vars.problem_str}
  fig_size: [12, 7]
  level_set: ${vars.level_set}
  show_colorbar: true

meshing:
  level_set: ${vars.level_set}
  nf_is_density: ${vars.nf_is_density}
  mc_resolution: 256
  mc_chunks: 1
  max_points_per_batch: 32768
  mesh_reduction: 0

plot_shape: true
val_plot_shape: true
plot_surface_points: true
plot_ph_diagram: true
plot_surface_pts_every_n_epochs: 100

timer:
  print: false
  accumulate: true

problem:
  problem_str: ${vars.problem_str}
  n_studs: 2
  no_studs: false

problem_sampling:
  nx: ${vars.nx}
  n_points_domain: 2048
  n_points_envelope: 8192
  n_points_interfaces: 10000
  n_points_normals: 10000
  n_points_surface: ${vars.n_points_surface}

max_epochs: 5000
lr: 0.001
opt: adam
use_scheduler: false
scheduler_gamma: 0.5
decay_steps: 5000

grad_clipping:
  grad_clipping_on: true
  grad_clip: 0.5
  auto_clip_on: true

model_save_path: 'checkpoints'
model_save_subdir: 'regular_ginn'   # save under checkpoints/regular_ginn/ (not cond_wire)
save_every_n_epochs: 10
overwrite_existing_saved_model: true
save_optimizer: true

# Train from scratch by default for comparison runs
load_mos: false
load_model: false
load_optimizer: false
load_scheduler: false
resume_same_run_dir: false
