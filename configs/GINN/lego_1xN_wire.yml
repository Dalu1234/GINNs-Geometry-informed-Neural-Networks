###################
## Model
###################
wandb_experiment_name: 'lego_1xN_cond_wire'

# put all reused variables into vars
vars:
  nx: 3 # input is 3D
  nz: 6 # dimension of the modulation vector (shape latent; +1 when condition_on_n_studs)
  ginn_bsize: 4 # batch size; 4 for 8GB GPU stability (was 6)
  val_plot_grid: [3, 3] # [n_first_dims, shapes_per_dim]; sampled using equidistant z (if nz>2), otherwise see latent_sampler
  problem_str: 'lego_1xN'
  ginn_on: 1
  # Conditioning on N (number of studs): one model for 1x2, 1x3, 1x4, 1x6 etc.
  condition_on_n_studs: true
  n_studs_values: [1,2,4,5,6,7,8,9,12,15]  # N studs: 2 → 1x2 only
  # Smooth N encoding: Gaussian blend over n_studs_values so unseen N (e.g. 7) is blend of 6,8
  use_smooth_n_encoding: false    # false = single scalar n_norm; true = vector of Gaussian weights
  smooth_n_sigma: 1.0            # sigma for Gaussian blend (only when use_smooth_n_encoding)
  # N MLP encoder: map n_norm (1 scalar) -> n_encoder_dim (e.g. 8) for richer conditioning; default off for compatibility
  use_n_encoder: true
  n_encoder_dim: 8
  # Conditioning on NxN (second dimension): 1 = 1xN, 2+ = NxM grid
  condition_on_n_studs_y: true
  n_studs_y_values: [1]   # 1 = 1xN only → no 2x2, 4x4
  # Conditioning on height: scale brick body height (1.0 = nominal LEGO)
  condition_on_height: true
  height_values: [1.0]     # one height → 1x2 only: (2,1,1.0)
  n_points_surface: 20000  # reduced from 40001 to avoid CUDA OOM when curvature starts (get_surface_pts)
  nf_is_density: false
  level_set: 0.0
  # Unseen-N evaluation: every K epochs compute metric on fixed unseen N (e.g. 3, 6, 7) for generalization monitoring
  unseen_n_studs: []   # N not in n_studs_values; set [] to disable
  unseen_eval_every_n_epochs: 50
  unseen_violation_every_n_epochs: 10  # run unseen_violation loss every N epochs (saves cost; omit to run every step)
  unseen_eval_metric: 'violation'   # 'violation' = mean interface+envelope loss; 'chamfer' = mean Chamfer to rule mesh (if implemented)
  unseen_eval_n_z_samples: 2       # z samples per unseen N for violation mean


# useful global variables
nx: ${vars.nx}
nz: ${vars.nz}
ginn_bsize: ${vars.ginn_bsize}
level_set: ${vars.level_set}
nf_is_density: ${vars.nf_is_density}
condition_on_n_studs: ${vars.condition_on_n_studs}
n_studs_values: ${vars.n_studs_values}
use_smooth_n_encoding: ${vars.use_smooth_n_encoding}
smooth_n_sigma: ${vars.smooth_n_sigma}
use_n_encoder: ${vars.use_n_encoder}
n_encoder_dim: ${vars.n_encoder_dim}
condition_on_n_studs_y: ${vars.condition_on_n_studs_y}
n_studs_y_values: ${vars.n_studs_y_values}
condition_on_height: ${vars.condition_on_height}
height_values: ${vars.height_values}
unseen_n_studs: ${vars.unseen_n_studs}
unseen_eval_every_n_epochs: ${vars.unseen_eval_every_n_epochs}
unseen_violation_every_n_epochs: ${vars.unseen_violation_every_n_epochs}
unseen_eval_metric: ${vars.unseen_eval_metric}
unseen_eval_n_z_samples: ${vars.unseen_eval_n_z_samples}


model:
  model_str: 'cond_wire'
  nx: ${vars.nx}
  nz: ${vars.nz}
  return_density: ${vars.nf_is_density}
  w0_initial: 18
  wire_scale: 6
  layers: [256,256,256,256]  # 4x256 (was 3x128); more capacity for multi-type / sharper geometry — watch GPU memory
  # Tiled coords: append (x_tile, y_tile) modulo stud spacing so the network sees position within each tile (one cylinder per tile)
  use_tiled_coords: true
  stud_spacing_normalized: 1.0   # in normalized LEGO space one stud spacing = 1.0
  # Distance to brick edge: append signed dist_to_edge_x (positive inside, negative outside) so the network can ignore phantom studs
  use_dist_to_edge: true
  n_studs_values: ${n_studs_values}   # required for dist_to_edge; z column index for n is n_norm_col (default 2)
  use_n_encoder: ${use_n_encoder}
  n_encoder_dim: ${n_encoder_dim}
  # Hypernetwork LoRA: per-brick low-rank deltas on last TWO layers (penult Gabor + final linear) for more expressivity
  use_hypernet: false
  lora_rank: 16   # was 4; higher rank = more directions to express 1x2 vs 1x4
  c_dim: 3
  hypernet_hidden: [64, 64, 32]   # deeper/wider so U,V have more capacity to differ across brick types
  lora_init_scale: 0.01
  # Regularization: dropout after hidden layers to reduce overfitting
  dropout_p: 0.05
  # FiLM: re-inject z at selected layers so conditioning is not washed out (better interpolation/generalization)
  use_film: true
  film_after_layers: [0, 2]   # after 1st and 2nd Gabor layer (0-indexed in backbone)
  film_hidden: 64             # hidden dim of gamma/beta MLPs

reset_zlatents_every_n_epochs: 1  # uncomment to set; not set means the latents are kept fix
latent_sampling:
  nz: ${vars.nz}
  ginn_bsize: ${vars.ginn_bsize}
  z_sample_method: 'uniform'  # any of ['uniform', 'normal', 'equidistant']
  val_plot_grid: ${vars.val_plot_grid}
  z_sample_interval: [0,0.1]

# Violation buffer: sample (z, c) proportional to interface+envelope violation (prioritized replay)
violation_buffer:
  use: true
  initial_size_per_c: 50   # (z_base, c) pairs per brick type at start
  sample_temperature: 1.0  # >1 smooths, <1 sharpens (more focus on high violation)
  random_fraction: 0.1     # mix in ~10% fresh random z to avoid collapsing onto a tiny corner of z space
  block_epochs_per_type: 0    # OFF temporarily: random type each step; with 2 types fine; removes one variable from experiment
  eps: 1.0e-8              # add to violations for sampling (avoid zero prob)


###################
## GINN
###################
train_plot_max_n_shapes: 9
plot_every_n_epochs: 100
valid_every_n_epochs: 200
# Skip expensive 3D plot at epoch 0 (6× marching cubes 256³ + PH) so first step completes and progress bar moves
skip_plot_epoch_0: true

###################
## Loss-balancing
###################
## Studs need a base shape: cuboid_primitive (box) + eikonal (valid SDF). Stud-only was too minimal.

## GINN losses
objective: 'null'

## Data losses
lambda_data: 0.0e+1
lambda_lip: ${eval:1.0e-7 * 0}
lambda_dirichlet: ${eval:1.0e1 * 0}

### local — cuboid base + stud formation
lambda_if: 0
lambda_env: 0
lambda_obst: ${eval:${vars.ginn_on} * 0.0}
lambda_if_normal: 0
lambda_cuboid_rule: 0
lambda_cuboid_primitive: ${eval:${vars.ginn_on} * 2}   # base box so field has coherent shape
lambda_stud_grid: ${eval:${vars.ginn_on} * 3}         # cylinders on top for studs
lambda_phantom_stud: ${eval:${vars.ginn_on} * 0.5}    # rule-enforcement: penalize negative SDF just outside brick at stud height
lambda_outside_brick_sdf: ${eval:${vars.ginn_on} * 0.3}   # outside brick (dist_to_edge < -margin) → push SDF > margin
lambda_prior: ${eval:${vars.ginn_on} * 0.01}   # small: train prior so sample_z_from_prior_prob can sample z ~ p(z|c)
lambda_latent_structure: ${eval:${vars.ginn_on} * 0.01}   # prevent collapse, cap magnitude, encourage diversity
# Unseen N + interpolation losses (all optional; set lambda_* > 0 to enable)
lambda_unseen_violation: 0     # penalize poor constraint satisfaction on unseen N (e.g. 3, 6, 7); off
lambda_interp_midpoint: 0     # eikonal + smooth-z at z_mid between brick types; off
interp_near_threshold: 0.1     # used only when lambda_interp_midpoint > 0
interp_n_domain_calls: 2
interp_min_near_points: 32
scale_interp_eikonal: 1.0
scale_interp_smooth_z: 0.1
sample_z_from_prior_prob: 0.3   # 30% of batches: sample z_base from prior (only when lambda_prior > 0)
prior_hidden: [32, 32]
prior_min_sigma: 1.0e-3

# Cuboid primitive loss settings (rule-based box learning)
# Total ~2000 pts (was 5000 - reduced for speed)
cuboid_n_inside: 800       # points inside box (should be f < -margin)
cuboid_n_near_faces: 400   # points just outside each face
cuboid_n_corners: 200      # points near box corners
cuboid_n_far: 200          # points far from box
cuboid_n_boundary: 400     # points on/near faces for SDF supervision
cuboid_safety_margin: 0.1  # how far inside/outside to enforce
cuboid_boundary_weight: 0.5  # weight for boundary sharpening term

# Stud grid loss (cylinder at every stud position → compositional rule for 1xN generalization)
stud_grid_n_samples: 200     # samples per stud cylinder
stud_grid_n_outside: 40      # fewer outside samples to reduce inward pull
stud_grid_shell_thickness: 0.02   # thinner shell: [radius, radius+this] in normalized space
stud_grid_safety_margin: 0.05
stud_spacing_normalized: 1.0 # in normalized LEGO space; 1 unit = one stud spacing

# Outside-brick SDF loss (dist_to_edge < -margin → push f > margin)
outside_brick_sdf_margin: 0.1
outside_brick_sdf_n_samples: 500

# Latent structure loss settings (latent space regularization)
latent_min_variance: 0.1      # minimum z variance per dim (prevent collapse)
latent_max_magnitude: 3.0     # maximum |z| per dim (prevent explosion)
latent_diversity_weight: 1.0  # weight for SDF-based diversity term
latent_n_diversity_pts: 100   # points for SDF comparison across z

### global — eikonal needed so SDF is valid and zero-level set is sharp
lambda_eikonal: ${eval:${vars.ginn_on} * 1.0}
lambda_scc: ${eval:${vars.ginn_on} * 0}
lambda_curv: 0
lambda_div: 0

max_curv: 0 # 180 # 500
max_div: -0.1

# Start epoch for each loss (epoch >= start_* then loss is active). Naming: start_{loss_name}
# Recommendation:
#   - Geometry (if, env, if_normal, eikonal, scc): from 0 (default) — fit shape first
#   - Curvature (curv): ~300–500 — regularize surface once SDF is roughly correct
#   - Diversity (div): ~500–800 — encourage latent diversity after geometry is good
start_curv: 500   # regularize curvature after shape is fitting
start_div: 2000   # diversity after curv has smoothed; step is skipped when get_surface_pts fails (see trainer)

scale_curv: 5.0e-4
# scale_curv: 1.0e-3
# scale_curv: 5.0e-5
scale_div: 0.03
scale_chamfer_div: 1
scale_vol: 1
scale_comp: 1
scale_eikonal: 0.5
scale_if_normal: 1

dirichlet_use_surface_points: true


###################
## Curvature
###################
# exclude_surface_points_close_to_interface_cutoff: 0.025  # 0.0 means no interface points are excluded
exclude_surface_points_close_to_interface_cutoff: 0.04  # 0.0 means no interface points are excluded



###################
## SCC algorithm
###################
ph:
  nx: ${vars.nx}
  problem_str: ${vars.problem_str}
  ginn_bsize: ${vars.ginn_bsize}
  is_density: ${vars.nf_is_density}
  iso_level: -0.02  # implicitly sets the thickness
  ph_1_hole_level: 0.06
  ph_loss_maxdim: 1
  ph_loss_target_betti: [1, 0, 0]
  scc_penalty_norm_eps: 1.0e-4
  scc_n_grid_points: 32   # 64 caused MemoryError in SCC workers (cripser.computePH); 32 reduces RAM
  ph_max_num_workers: 4   # fewer workers = less peak RAM when computing PH (base 16)
  evaluate_ph_grid_per_shape: true  # set to true to save memory, but slower

###################
## Surface points
###################
surface:
  nx: ${vars.nx}
  n_points_surface: ${vars.n_points_surface}
  level_set: ${vars.level_set}
  do_numerical_surface_points: false
  bin_search_steps: 10
  equidistant_init_grid: true
  do_uniform_resampling: true
  recompute_every_n_epochs: 1

###################
## DIVERSITY
###################
div_norm_order: 2



###################
## Metrics computation
###################



###################
## LOGGING
###################
log_level: 'INFO'

## Multi-processing (can set to 9 for plotting/PH even when ginn_bsize is reduced for OOM)
num_workers: 9  # was min(ginn_bsize,9); use 9 for full parallelism or match ginn_bsize to save RAM

## Plotting
plot:
  val_plot_grid: ${vars.val_plot_grid}
  problem_str: ${vars.problem_str}
  fig_size: [12, 7]
  level_set: ${vars.level_set}
  show_colorbar: true

meshing:
  level_set: ${vars.level_set}
  nf_is_density: ${vars.nf_is_density}
  mc_resolution: 256   # higher for clearer studs/walls when re-extracting
  mc_chunks: 1         # must be 1 when watertight=True
  max_points_per_batch: 32768   # 32^3; avoid GPU OOM on 8GB during validation mesh extraction
  mesh_reduction: 0    # 0 = no simplification; was 0.9 (blobs). Re-extract from checkpoint to test.


## Specific plots
plot_shape: true
val_plot_shape: true
plot_surface_points: true
plot_ph_diagram: true
plot_surface_pts_every_n_epochs: 100

## Timer
timer:
  print: false
  accumulate: true  # record and print accumulated timings at the end

###################
## Problem
###################
problem:
  problem_str: ${vars.problem_str}
  n_studs: 2  # LEGO-specific: default when not conditioning (1x2); ignored when condition_on_n_studs is true (N sampled per batch)
  no_studs: false  # must be false for stud formation: bounds and mesh extraction include stud volume; stud_grid loss aligns with output

problem_sampling:
  ## Number of points to sample (conservative for 8GB GPU to avoid crashes)
  nx: ${vars.nx}
  n_points_domain: 2048   # eikonal loss
  n_points_envelope: 8192   # was 12288; reduced for 8GB
  n_points_interfaces: 10000  # 5k to studs, 5k to walls (50/50 in sample_from_interface)
  n_points_normals: 10000     # match interfaces
  n_points_surface: ${vars.n_points_surface}

###################
## Training
###################
## Outer optimization loop
max_epochs: 5000
lr: 0.001
## optimizer (weight_decay = L2 regularization to reduce overfitting)
opt: adam  # adam, lbfgs, adam_lbfgs, adam_nncg, adam_lbfgs_nncg
weight_decay: 1e-5   # L2 regularization to reduce overfitting
## scheduler
use_scheduler: false
scheduler_gamma: 0.5
decay_steps: 5000

grad_clipping:
  grad_clipping_on: true
  grad_clip: 0.5
  auto_clip_on: true

## Weight saving
# model_save_path: '_saved_models'
model_save_path: 'path/to/dir'
save_every_n_epochs: 10
overwrite_existing_saved_model: true   # overwrite same files in run dir (one model.pt, one optim.pt); false = many ...-it_00010-model.pt
save_optimizer: true

## Weight loading (train from scratch = no load; resume = set load_* true and model_load_path)
load_mos: false   # true = load model + optimizer + scheduler from path
load_model: false
load_optimizer: false
load_scheduler: false
#model_load_path: 'path/to/dir/cond_wire/2026_02_04__20_31_09-tiy5hqdl/2026_02_04__20_31_09-tiy5hqdl-model.pt'
#model_load_path: 'path/to/dir/cond_wire/2026_02_05__02_02_38-3k34l224/2026_02_05__02_02_38-3k34l224-model.pt'
model_load_latest: false  # find latest *-model.pt under model_save_path/model_str
resume_same_run_dir: false  # false = new folder for this run; true = save into loaded run dir
# model_load_wandb_id: 'mb8z12t1'