###################
## FINE-TUNING WITH PERSISTENT HOMOLOGY (SCC) APPROACH
## 
## Uses PHManager with cripser for topological connectivity
## instead of Morse theory saddle detection (which failed)
##
## Key: lambda_scc enforces Betti number targets:
##   - ph_loss_target_betti: [1, 0, 0] means:
##     - b0 = 1 (one connected component)
##     - b1 = 0 (no holes)
##     - b2 = 0 (no voids)
###################

wandb_experiment_name: 'simjeb_finetune_scc'

# ============================================
# MATCH ORIGINAL ARCHITECTURE
# ============================================
vars:
  nx: 3
  nz: 2
  ginn_bsize: 9
  problem_str: 'simjeb'
  ginn_on: 1
  level_set: 0
  n_points_surface: 2048

nx: ${vars.nx}
nz: ${vars.nz}
ginn_bsize: ${vars.ginn_bsize}
level_set: ${vars.level_set}

nf_is_density: False

###################
## Training Mode
###################
training_mode: 'single'

###################
## Model - SAME as original pretrained
###################
model:
  model_str: 'cond_wire'
  nx: ${vars.nx}
  nz: ${vars.nz}
  return_density: False
  w0_initial: 18
  w0: 1
  wire_scale: 6
  layers: [128, 128, 128]
  use_legacy_gabor: True

reset_zlatents_every_n_epochs: 1

latent_sampling:
  nz: ${vars.nz}
  ginn_bsize: ${vars.ginn_bsize}
  z_sample_method: 'uniform'
  val_plot_grid: [3, 3]
  z_sample_interval: [0, 0.1]

###################
## Data
###################
data:
  simjeb_ids: [62, 148]

###################
## Plotting
###################
train_plot_max_n_shapes: 9
plot_every_n_epochs: 50
valid_every_n_epochs: 100

###################
## LOSS CONFIGURATION
###################
objective: 'curv'
field_losses: []

lambda_data: 0.0
lambda_lip: 0.0
lambda_dirichlet: 0.0

# ============================================
# SHAPE PRESERVATION LOSSES (reduced for fine-tuning)
# ============================================
lambda_if: 10
lambda_env: 100
lambda_obst: 0.0
lambda_if_normal: 0.1

# ============================================
# SCC (PERSISTENT HOMOLOGY) - MAIN CONNECTIVITY LOSS
# Uses PHManager with cripser for Betti number targeting
# ============================================
lambda_scc: 50.0

# DISABLE Morse theory connectivity (it failed)
lambda_connectivity: 0.0

# Other regularization
lambda_div: 0.0
lambda_eikonal: 0.01
lambda_curv: 0.0001

lambda_comp: 0.0
lambda_vol: 0.0

max_curv: 0
max_div: -0.1

start_curv: 0
start_div: 0

scale_curv: 1.0
scale_div: 1.0
scale_eikonal: 1.0

dirichlet_use_surface_points: True

# Connectivity loss disabled
connectivity_n_samples: 500
connectivity_n_iter: 30
connectivity_grad_tol: 0.01
connectivity_update_every_n_epochs: 20
connectivity_near_surface_threshold: 0.15
connectivity_max_step_size: 0.3
scale_connectivity: 1.0
start_connectivity: 0

###################
## Curvature
###################
curvature_expression: '4*H**2 - 2*K'
curvature_use_gradnorm_weights: False
curvature_pts_source: 'surface'

###################
## Surface Points
###################
exclude_surface_points_close_to_interface_cutoff: 0.02

###################
## PERSISTENT HOMOLOGY (PHManager) CONFIGURATION
###################
ph:
  nx: ${vars.nx}
  problem_str: ${vars.problem_str}
  ginn_bsize: ${vars.ginn_bsize}
  is_density: False
  iso_level: 0.0
  ph_1_hole_level: 0.06
  ph_loss_maxdim: 1
  ph_loss_target_betti: [1, 0, 0]
  ph_loss_sub0_points: False
  ph_loss_super0_points: False
  scc_penalty_norm_eps: 1.0e-4
  scc_n_grid_points: 32
  evaluate_ph_grid_per_shape: True

###################
## Surface Points
###################
surface:
  nx: ${vars.nx}
  n_points_surface: ${vars.n_points_surface}
  level_set: ${vars.level_set}
  do_numerical_surface_points: False
  bin_search_steps: 10
  equidistant_init_grid: True
  do_uniform_resampling: True
  recompute_every_n_epochs: 1

###################
## Optimizer - CONSERVATIVE for fine-tuning
###################
opt: adam

###################
## Training
###################
max_epochs: 3000
log_every_n_steps: 10
gradient_clip_val: 1.0

###################
## Checkpointing - LOAD PRETRAINED
###################
resume_from_checkpoint: '../checkpoints/GINN-model.pt'
strict_load: True

###################
## Logging
###################
log_level: 'INFO'
num_workers: ${eval:min(${vars.ginn_bsize}, 8)}

###################
## Plotting
###################
plot:
  val_plot_grid: [3, 3]
  problem_str: ${vars.problem_str}
  fig_size: [12, 7]
  level_set: ${vars.level_set}
  show_colorbar: True

meshing:
  level_set: ${vars.level_set}
  nf_is_density: False
  mc_resolution: 128

plot_shape: True
val_plot_shape: True
plot_surface_points: True
plot_ph_diagram: True

timer:
  print: False
  accumulate: True

###################
## Problem
###################
problem:
  problem_str: ${vars.problem_str}

problem_sampling:
  nx: ${vars.nx}
  n_points_domain: 2048
  n_points_envelope: 16383
  n_points_interfaces: 4096
  n_points_normals: 4096
  n_points_surface: 8192

###################
## TRAINING - FINE-TUNING SETTINGS
###################
lr: 0.0001
use_scheduler: False
scheduler_gamma: 0.5
decay_steps: 5000

use_augmented_lagrangian: True

grad_clipping:
  grad_clipping_on: True
  grad_clip: 0.5
  auto_clip_on: True

model_save_path: 'checkpoints'
save_every_n_epochs: 50
overwrite_existing_saved_model: True
save_optimizer: True

# LOAD PRETRAINED MODEL
load_mos: False
load_model: True
model_load_path: 'checkpoints/GINN-model.pt'
load_optimizer: False
load_scheduler: False
